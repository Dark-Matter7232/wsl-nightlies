name: Build WSL Kernels (Nevuly Rolling)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Nevuly Rolling branch/tag/commit (use 'auto' for latest release-tracked branch)"
        required: false
        default: "auto"
        type: string
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: build-wsl-nevuly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-kernel:
    name: Build ${{ matrix.name }} kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            arch: arm64
            cache_arch: arm64
            config_file: arch/arm64/configs/config-wsl-arm64
            compiler: cross
            kcflags: -O3 -march=armv8.7-a+crypto -mtune=cortex-x4
            tuning: -O3 -march=armv8.7-a+crypto -mtune=cortex-x4
            localversion: -WSL2-STABLE-Const
            image_target: Image
            image_path: arch/arm64/boot/Image
            image_name: Image-arm64
          - name: x64
            arch: x86_64
            cache_arch: x64
            config_file: arch/x86/configs/config-wsl-x86
            compiler: native
            kcflags: -O3 -march=x86-64-v4 -mtune=znver4
            tuning: -O3 -march=x86-64-v4 -mtune=znver4
            localversion: -WSL2-STABLE-ZEN4
            image_target: bzImage
            image_path: arch/x86/boot/bzImage
            image_name: bzImage-x64

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-nevuly-${{ matrix.cache_arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-nevuly-${{ matrix.cache_arch }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc dwarves libssl-dev libelf-dev ccache

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y \
              gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu \
              crossbuild-essential-arm64
            sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-14 100
            sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-g++ aarch64-linux-gnu-g++ /usr/bin/aarch64-linux-gnu-g++-14 100
          fi

      - name: Clone kernel source (Nevuly)
        id: clone
        run: |
          REQUESTED_REF="${{ github.event.inputs.kernel_ref }}"

          if [ -n "$REQUESTED_REF" ] && [ "$REQUESTED_REF" != "auto" ]; then
            KERNEL_REF="$REQUESTED_REF"
            echo "Using manually requested ref: $KERNEL_REF"
          else
            LATEST_TAG="$(curl -fsSL https://api.github.com/repos/Nevuly/WSL2-Linux-Kernel-Rolling/releases/latest | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1 || true)"
            BRANCHES="$(curl -fsSL https://api.github.com/repos/Nevuly/WSL2-Linux-Kernel-Rolling/branches?per_page=100 | grep -o '"name"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/' || true)"

            KERNEL_REF=""
            if [[ "$LATEST_TAG" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              CANDIDATE="wsl-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}-rolling"
              if echo "$BRANCHES" | grep -qx "$CANDIDATE"; then
                KERNEL_REF="$CANDIDATE"
              fi
            fi

            if [ -z "$KERNEL_REF" ]; then
              KERNEL_REF="$(echo "$BRANCHES" | grep -E '^wsl-[0-9]+\.[0-9]+-rolling$' | sort -V | tail -n1)"
            fi

            if [ -z "$KERNEL_REF" ] && echo "$BRANCHES" | grep -qx "next"; then
              KERNEL_REF="next"
            fi

            if [ -z "$KERNEL_REF" ] && echo "$BRANCHES" | grep -qx "master"; then
              KERNEL_REF="master"
            fi

            if [ -z "$KERNEL_REF" ]; then
              echo "Failed to determine kernel ref from release/branches"
              exit 1
            fi

            echo "Auto-selected rolling ref: $KERNEL_REF"
          fi

          git clone --depth 1 --branch "$KERNEL_REF" https://github.com/Nevuly/WSL2-Linux-Kernel-Rolling.git linux

          echo "KERNEL_REF=$KERNEL_REF" >> "$GITHUB_ENV"
          echo "kernel_sha=$(git -C linux rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure kernel (base defconfig + local deltas)
        run: |
          export ARCH=${{ matrix.arch }}
          export KCFLAGS="${{ matrix.kcflags }}"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_COMPILERCHECK=content
          if [ "${{ matrix.compiler }}" = "cross" ]; then
            export CROSS_COMPILE="ccache aarch64-linux-gnu-"
          else
            export CC="ccache gcc"
          fi

          ccache -M 5G
          ccache -z

          cp "linux/${{ matrix.config_file }}" linux/.config
          cd linux

          # Extra debloat from working-config analysis (compile-heavy subsystems)
          ./scripts/config --disable CONFIG_COMPILE_TEST
          ./scripts/config --disable CONFIG_AUDIT
          ./scripts/config --disable CONFIG_WLAN
          ./scripts/config --disable CONFIG_WIRELESS
          ./scripts/config --disable CONFIG_BT
          ./scripts/config --disable CONFIG_SOUND
          ./scripts/config --disable CONFIG_MEDIA_SUPPORT
          ./scripts/config --disable CONFIG_VIDEO
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ./scripts/config --disable CONFIG_ARM64_PLATFORM_DEVICES
          fi
          ./scripts/config --disable CONFIG_XEN
          ./scripts/config --disable CONFIG_SURFACE_PLATFORMS
          ./scripts/config --disable CONFIG_MELLANOX_PLATFORM
          ./scripts/config --disable CONFIG_GENERIC_PHY
          ./scripts/config --disable CONFIG_PSTORE
          ./scripts/config --disable CONFIG_DEBUG_KERNEL
          ./scripts/config --disable CONFIG_PROFILING
          ./scripts/config --disable CONFIG_KALLSYMS_ALL
          ./scripts/config --disable CONFIG_KPROBES
          ./scripts/config --disable CONFIG_UPROBES
          ./scripts/config --disable CONFIG_FTRACE
          ./scripts/config --disable CONFIG_FUNCTION_TRACER
          ./scripts/config --disable CONFIG_DYNAMIC_FTRACE
          ./scripts/config --disable CONFIG_HZ_1000
          ./scripts/config --enable CONFIG_HZ_250
          ./scripts/config --enable CONFIG_DRM
          ./scripts/config --enable CONFIG_DRM_VGEM
          ./scripts/config --enable CONFIG_USBIP_CORE
          ./scripts/config --enable CONFIG_USBIP_VHCI_HCD
          ./scripts/config --enable CONFIG_USB_SERIAL
          ./scripts/config --enable CONFIG_USB_SERIAL_CH341
          ./scripts/config --set-val CONFIG_HZ 250

          # Speed up compilation
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --enable CONFIG_DEBUG_INFO_NONE
          ./scripts/config --disable CONFIG_KASAN
          ./scripts/config --disable CONFIG_KCSAN
          ./scripts/config --disable CONFIG_UBSAN
          ./scripts/config --disable CONFIG_KCOV
          ./scripts/config --disable CONFIG_GDB_SCRIPTS
          ./scripts/config --disable CONFIG_RUST
          ./scripts/config --set-str CONFIG_LOCALVERSION "${{ matrix.localversion }}"

          make ARCH=${{ matrix.arch }} KCFLAGS="$KCFLAGS" olddefconfig

      - name: Build kernel
        run: |
          export ARCH=${{ matrix.arch }}
          export KCFLAGS="${{ matrix.kcflags }}"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          if [ "${{ matrix.compiler }}" = "cross" ]; then
            export CROSS_COMPILE="ccache aarch64-linux-gnu-"
          else
            export CC="ccache gcc"
          fi

          make -C linux ARCH=${{ matrix.arch }} KCFLAGS="$KCFLAGS" -j"$(nproc)" ${{ matrix.image_target }} modules
          ccache -s

      - name: Prepare artifacts
        id: prep
        run: |
          BUILD_DATE="$(date -u +%Y%m%d)"
          mkdir -p artifacts

          cp "linux/${{ matrix.image_path }}" "artifacts/${{ matrix.image_name }}"
          cp linux/.config "artifacts/config-${{ matrix.cache_arch }}-nevuly-base"
          cp linux/System.map "artifacts/System.map-${{ matrix.cache_arch }}"
          cp linux/Module.symvers "artifacts/Module.symvers-${{ matrix.cache_arch }}"

          {
            echo "Kernel Source: Nevuly/WSL2-Linux-Kernel-Rolling"
            echo "Ref: $KERNEL_REF"
            echo "Commit: $(git -C linux rev-parse HEAD)"
            echo "Date: $(date -u)"
            echo "Platform: ${{ matrix.name }}"
            echo "Tuning: ${{ matrix.tuning }}"
            echo "USB serial: CH341 enabled"
          } > artifacts/build-info.txt

          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wsl-${{ matrix.cache_arch }}-${{ steps.prep.outputs.build_date }}-${{ steps.clone.outputs.kernel_sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  publish-kernel-release:
    name: Publish kernel nightly release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build-kernel]
    if: needs.build-kernel.result == 'success'
    steps:
      - name: Download ARM64 and x64 kernel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wsl-*-*
          path: release-assets
          merge-multiple: false

      - name: Set kernel release metadata
        id: release
        shell: bash
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "tag=kernel-nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Publish kernel nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Nevuly Rolling Kernel Nightly ${{ steps.release.outputs.date }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/**/*
          body: |
            ARM64 and x64 kernels built from Nevuly/WSL2-Linux-Kernel-Rolling.

            Includes each architecture's kernel image, config, System.map, Module.symvers, and build information.
            Re-running this workflow on the same day updates this release's assets.
